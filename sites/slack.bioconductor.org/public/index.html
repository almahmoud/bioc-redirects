<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown with Embedded Blog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    #countdown {
      font-size: 2em;
      color: #007bff;
      margin: 20px 0;
    }
    .iframe-container {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 30px auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Redirecting in <span id="countdown">10</span> seconds...</h1>
  <p>Bioconductor has discontinued the Community Slack and moved to Zulip! You can find more about this transition in <a href="https://blog.bioconductor.org/posts/2025-05-29-slack-to-zulip/" target="_blank">this blog post</a>, which you can preview below.</p>
  <div class="iframe-container">
    <iframe 
      src="https://blog.bioconductor.org/posts/2025-05-29-slack-to-zulip/" 
      title="Bioconductor Slack to Zulip Announcement"
      allowfullscreen>
    </iframe>
  </div>
  <p>If you are not redirected automatically or wish to skip the countdown, <a href="https://community-bioc.zulipchat.com/" id="manual-link">click here</a>.</p>
  <script>
    let seconds = 10;
    const countdownElem = document.getElementById('countdown');
    const redirectUrl = "https://community-bioc.zulipchat.com/join/4k2tpsy7h6zjbaduydwm2n56/";

    const interval = setInterval(() => {
      seconds--;
      countdownElem.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = redirectUrl;
      }
    }, 1000);
  </script>
</body>
</html>
