# slack.bioconductor.org: serves sites/slack.bioconductor.org/public/index.html over HTTPS.
# Requires mod_ssl and mod_dir.
# The plain HTTP redirect is in docs/examples/apache-http-redirect.conf.

<VirtualHost *:443>
    ServerName slack.bioconductor.org
    DocumentRoot /var/www/slack.bioconductor.org

    SSLEngine on
    # Certificate file holds the *.bioconductor.org leaf followed by its intermediates.
    SSLCertificateFile    /etc/ssl/bioconductor.org/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/bioconductor.org/privkey.pem

    <Directory /var/www/slack.bioconductor.org>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/slack.bioconductor.org-error.log
    CustomLog ${APACHE_LOG_DIR}/slack.bioconductor.org-access.log combined
</VirtualHost>
