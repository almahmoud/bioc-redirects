# chat.bioconductor.org: redirects every HTTPS request to the Zulip invitation link.
# Requires mod_ssl and mod_alias.
# The plain HTTP redirect is in docs/examples/apache-http-redirect.conf.

<VirtualHost *:443>
    ServerName chat.bioconductor.org

    SSLEngine on
    SSLCertificateFile    /etc/ssl/bioconductor.org/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/bioconductor.org/privkey.pem

    # 302 so the target can change without browsers caching the old one.
    RedirectMatch 302 ^ https://community-bioc.zulipchat.com/join/4k2tpsy7h6zjbaduydwm2n56/

    ErrorLog ${APACHE_LOG_DIR}/chat.bioconductor.org-error.log
    CustomLog ${APACHE_LOG_DIR}/chat.bioconductor.org-access.log combined
</VirtualHost>
