# Server-wide settings, for example /etc/apache2/conf-available/hardening.conf,
# enabled with: a2enconf hardening
# They apply to every virtual host on the server, including git.bioconductor.org
# when it shares the host.
# TLSv1.3 needs Apache 2.4.36 or later built against OpenSSL 1.1.1 or later;
# on earlier versions, remove +TLSv1.3.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
SSLProtocol -all +TLSv1.2 +TLSv1.3
