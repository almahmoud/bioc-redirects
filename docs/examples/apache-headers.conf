# Response headers for the endpoints. Paste inside each *:443 VirtualHost in apache/;
# at server level, every virtual host on the server inherits them.
# Requires mod_headers: a2enmod headers
# The policy blocks framing of the endpoint itself; the slack page still frames the blog.
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
