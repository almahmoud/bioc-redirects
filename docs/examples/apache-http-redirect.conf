# Plain HTTP to HTTPS redirects for the hostnames in apache/. Requires mod_alias.
# Install as /etc/apache2/sites-available/bioc-redirects-http.conf and enable with:
# a2ensite bioc-redirects-http
# Without them, the host's default *:80 virtual host answers for these hostnames.

<VirtualHost *:80>
    ServerName slack.bioconductor.org
    Redirect permanent / https://slack.bioconductor.org/
</VirtualHost>

<VirtualHost *:80>
    ServerName zulip.bioconductor.org
    Redirect permanent / https://zulip.bioconductor.org/
</VirtualHost>

<VirtualHost *:80>
    ServerName chat.bioconductor.org
    Redirect permanent / https://chat.bioconductor.org/
</VirtualHost>
